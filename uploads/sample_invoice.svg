<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <!-- Background -->
  <rect width="600" height="800" fill="#ffffff" rx="12"/>
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="#e2e8f0" stroke-width="2" rx="8"/>
  
  <!-- Header Banner -->
  <rect x="40" y="40" width="520" height="90" fill="#0f172a" rx="6"/>
  <text x="65" y="80" font-family="monospace" font-size="22" font-weight="bold" fill="#38bdf8">FAKTUR PENJUALAN RESMI</text>
  <text x="65" y="105" font-family="sans-serif" font-size="12" fill="#94a3b8">PT LOGISTIK NUSANTARA JAYA • CABANG SURABAYA</text>
  <rect x="440" y="55" width="100" height="30" fill="#22c55e" rx="4"/>
  <text x="465" y="75" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">ORIGINAL</text>

  <!-- Document Meta -->
  <rect x="40" y="150" width="520" height="110" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="6"/>
  
  <text x="60" y="180" font-family="sans-serif" font-size="11" fill="#64748b">NOMOR FAKTUR / INVOICE</text>
  <text x="60" y="202" font-family="monospace" font-size="16" font-weight="bold" fill="#0f172a">INV/2026/001</text>
  
  <text x="320" y="180" font-family="sans-serif" font-size="11" fill="#64748b">TANGGAL TERBIT</text>
  <text x="320" y="202" font-family="sans-serif" font-size="13" font-weight="600" fill="#0f172a">13 Oktober 2026</text>
  
  <text x="60" y="235" font-family="sans-serif" font-size="11" fill="#64748b">NAMA CUSTOMER TERCATAT</text>
  <text x="60" y="252" font-family="monospace" font-size="14" font-weight="bold" fill="#dc2626">PT WOKWPWKW (MOHON REVISI)</text>

  <text x="320" y="235" font-family="sans-serif" font-size="11" fill="#64748b">KODE CABANG</text>
  <text x="320" y="252" font-family="sans-serif" font-size="13" font-weight="600" fill="#0f172a">SUB-01 (Surabaya Hub)</text>

  <!-- Table Header -->
  <rect x="40" y="280" width="520" height="35" fill="#e2e8f0" rx="4"/>
  <text x="60" y="303" font-family="sans-serif" font-size="11" font-weight="bold" fill="#334155">DESKRIPSI BARANG / JASA</text>
  <text x="340" y="303" font-family="sans-serif" font-size="11" font-weight="bold" fill="#334155">QTY</text>
  <text x="420" y="303" font-family="sans-serif" font-size="11" font-weight="bold" fill="#334155">TOTAL (IDR)</text>

  <!-- Items -->
  <text x="60" y="340" font-family="sans-serif" font-size="12" fill="#1e293b">Pengiriman Logistik Kargo Batch A</text>
  <text x="345" y="340" font-family="monospace" font-size="12" fill="#1e293b">1 Lot</text>
  <text x="420" y="340" font-family="monospace" font-size="12" font-weight="600" fill="#1e293b">Rp 25.000.000</text>
  <line x1="40" y1="360" x2="560" y2="360" stroke="#f1f5f9" stroke-width="1"/>

  <text x="60" y="385" font-family="sans-serif" font-size="12" fill="#1e293b">Asuransi &amp; Handling Heavy Goods</text>
  <text x="345" y="385" font-family="monospace" font-size="12" fill="#1e293b">1 Lot</text>
  <text x="420" y="385" font-family="monospace" font-size="12" font-weight="600" fill="#1e293b">Rp 15.000.000</text>
  <line x1="40" y1="405" x2="560" y2="405" stroke="#f1f5f9" stroke-width="1"/>

  <text x="60" y="430" font-family="sans-serif" font-size="12" fill="#1e293b">PPN 11% Terminal Retribusi</text>
  <text x="345" y="430" font-family="monospace" font-size="12" fill="#1e293b">1 Lot</text>
  <text x="420" y="430" font-family="monospace" font-size="12" font-weight="600" fill="#1e293b">Rp  5.000.000</text>
  <line x1="40" y1="450" x2="560" y2="450" stroke="#cbd5e1" stroke-width="2"/>

