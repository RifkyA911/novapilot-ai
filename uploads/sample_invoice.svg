  <rect x="300" y="470" width="260" height="70" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" rx="6"/>
  <text x="320" y="495" font-family="sans-serif" font-size="12" font-weight="bold" fill="#64748b">TOTAL TAGIHAN</text>
  <text x="320" y="525" font-family="monospace" font-size="20" font-weight="bold" fill="#0f172a">Rp 45.000.000</text>

  <!-- Watermark Stamp -->
  <g transform="translate(180, 560) rotate(-15)">
    <rect width="240" height="70" fill="none" stroke="#22c55e" stroke-width="4" stroke-dasharray="8,4" rx="8"/>
    <text x="30" y="45" font-family="sans-serif" font-size="24" font-weight="bold" fill="#22c55e" opacity="0.8">TERVERIFIKASI</text>
  </g>

