  <text x="60" y="705" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1d4ed8">CATATAN IT ON-CALL / TIKET:</text>
  <text x="60" y="725" font-family="sans-serif" font-size="10" fill="#3b82f6">Dokumen fisik diunggah via WhatsApp Baileys Ingress. OCR dianalisis oleh Tesseract.js.</text>
</svg>
