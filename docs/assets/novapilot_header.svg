<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="40%" stop-color="#0b1329" />
      <stop offset="80%" stop-color="#060911" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="pillGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.05" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Tech Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1.5" fill="#3b82f6" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="20" fill="url(#gridPattern)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="240" cy="140" r="180" fill="#10b981" fill-opacity="0.08" filter="url(#glowFilter)" />
  <circle cx="960" cy="240" r="220" fill="#3b82f6" fill-opacity="0.08" filter="url(#glowFilter)" />
  <circle cx="600" cy="380" r="160" fill="#8b5cf6" fill-opacity="0.06" filter="url(#glowFilter)" />

  <!-- Decorative Circuit Wave Lines -->
  <path d="M 0 160 Q 300 240, 600 140 T 1200 200" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6 4" stroke-opacity="0.6" />
  <path d="M 0 280 Q 400 180, 800 320 T 1200 240" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="8 6" stroke-opacity="0.3" />
  <path d="M 100 40 Q 500 120, 900 60 T 1200 100" fill="none" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="10 8" stroke-opacity="0.25" />

  <!-- Top Border Gradient Glow Line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)" />

  <!-- ========================================================================= -->
  <!-- LEFT EMBLEM & SHIELD ICON (x=80, y=90)                                    -->
  <!-- ========================================================================= -->
  <g transform="translate(85, 110)">
    <!-- Outer Orbital Rings -->
    <circle cx="80" cy="80" r="76" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="12 8" />
    <circle cx="80" cy="80" r="64" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="8 6" />
    
    <!-- Shield Container Box -->
    <rect x="25" y="25" width="110" height="110" rx="28" fill="#0f172a" stroke="#10b981" stroke-width="2.5" filter="url(#nodeGlow)" />
    
    <!-- Shield & Checkmark Path -->
    <path d="M 80 44 L 112 56 V 82 C 112 104, 98 120, 80 126 C 62 120, 48 104, 48 82 V 56 Z" fill="url(#shieldGrad)" />
    <path d="M 68 82 L 76 90 L 94 72" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ========================================================================= -->
  <!-- CENTER TITLE & BRANDING (x=290, y=90)                                     -->
  <!-- ========================================================================= -->
  <g transform="translate(290, 80)">
    <!-- Top System Badges -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="155" height="26" rx="13" fill="url(#pillGrad1)" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="14" cy="13" r="4" fill="#10b981" />
      <text x="26" y="17" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#10b981" letter-spacing="1">CHATOPS GATEKEEPER</text>

      <rect x="165" y="0" width="145" height="26" rx="13" fill="url(#pillGrad2)" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="179" cy="13" r="4" fill="#3b82f6" />
      <text x="191" y="17" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#3b82f6" letter-spacing="1">DUAL-DB + MCP CORE</text>

      <rect x="320" y="0" width="140" height="26" rx="13" fill="url(#pillGrad3)" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="334" cy="13" r="4" fill="#8b5cf6" />
      <text x="346" y="17" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#a78bfa" letter-spacing="1">VISION OCR PIPELINE</text>
    </g>

    <!-- Main Title Heading -->
    <text x="0" y="105" font-family="'Segoe UI', -apple-system, sans-serif" font-size="48" font-weight="900" fill="#ffffff" letter-spacing="-1">
      NOVAPILOT <tspan fill="url(#accentGrad)">AI</tspan>
    </text>

    <!-- Tagline Subtitle -->
    <text x="0" y="140" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
      Autonomous ChatOps &amp; Human-in-the-Loop Enterprise Database Gatekeeper
    </text>

    <!-- Core Security Invariant Pill -->
    <g transform="translate(0, 168)">
      <rect x="0" y="0" width="790" height="38" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <circle cx="20" cy="19" r="4" fill="#ef4444" />
      <text x="34" y="24" font-family="monospace" font-size="12" font-weight="bold" fill="#f87171">SECURITY INVARIANT:</text>
      <text x="180" y="24" font-family="'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">
        Zero Raw SQL Injection • AI never mutates business data without verified Human-in-the-Loop sign-off
      </text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- BOTTOM ARCHITECTURAL PILLARS (x=80, y=325)                                -->
  <!-- ========================================================================= -->
  <g transform="translate(85, 335)">
    <!-- Pillar 1: Ingress Zone -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="235" height="58" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="16" y="24" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">1. Multi-Client Ingress</text>
      <text x="16" y="44" font-family="monospace" font-size="10.5" fill="#64748b">WhatsApp • Ferdium • Rambox</text>
    </g>

    <!-- Pillar 2: Vision OCR & Core -->
    <g transform="translate(265, 0)">
      <rect x="0" y="0" width="235" height="58" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="16" y="24" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#a78bfa">2. Tesseract OCR &amp; Core</text>
      <text x="16" y="44" font-family="monospace" font-size="10.5" fill="#64748b">Bilingual Nota • Go Engine :8088</text>
    </g>

    <!-- Pillar 3: DB 1 System Store -->
    <g transform="translate(530, 0)">
      <rect x="0" y="0" width="235" height="58" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="16" y="24" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#34d399">3. DB 1: System Store</text>
      <text x="16" y="44" font-family="monospace" font-size="10.5" fill="#64748b">PostgreSQL 18 Local (:5432)</text>
    </g>

    <!-- Pillar 4: DB 2 Enterprise MCP -->
    <g transform="translate(795, 0)">
      <rect x="0" y="0" width="235" height="58" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="16" y="24" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#60a5fa">4. DB 2: Enterprise MCP</text>
      <text x="16" y="44" font-family="monospace" font-size="10.5" fill="#64748b">Oracle 19c • Remote ERP via MCP</text>
    </g>
  </g>
</svg>
