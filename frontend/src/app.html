<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>NovaPilot AI — Autonomous ChatOps & Database Gatekeeper</title>
		
		<!-- Theme Initialization (Light by Default, respects stored preference) -->
		<script>
			try {
				const theme = localStorage.getItem('theme');
				if (theme === 'dark') {
					document.documentElement.classList.add('dark');
				} else {
					document.documentElement.classList.remove('dark');
				}
			} catch (_) {}
		</script>

		<!-- Official Vercel (Geist, Geist Mono) & Nuxt (Inter) Typography -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" />
		
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-background text-foreground antialiased min-h-screen selection:bg-primary/20 selection:text-primary font-sans">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
