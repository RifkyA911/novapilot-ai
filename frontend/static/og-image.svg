<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#050811" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Emerald Glow Radial -->
    <radialGradient id="emeraldRadial" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Cyan Glow Radial -->
    <radialGradient id="cyanRadial" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Deep Dark Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Grid Pattern Overlay -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-opacity="0.15" stroke-width="1" />
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="240" cy="200" r="380" fill="url(#emeraldRadial)" />
  <circle cx="960" cy="440" r="380" fill="url(#cyanRadial)" />

  <!-- Top Badge: Enterprise Product -->
  <g transform="translate(80, 75)">
    <rect width="320" height="36" rx="18" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="20" cy="18" r="5" fill="#10b981" />
    <text x="35" y="23" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">
      ENTERPRISE AUTONOMOUS CHATOPS
    </text>
  </g>

  <!-- Logo Icon + Title -->
  <g transform="translate(80, 140)">
    <!-- Shield Icon (80x80) -->
    <rect width="72" height="72" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
    <path d="M 36 12 C 48 12 58 16 58 24 C 58 44 45 56 36 60 C 27 56 14 44 14 24 C 14 16 24 12 36 12 Z" 
          fill="url(#shieldGrad)" fill-opacity="0.2" stroke="url(#shieldGrad)" stroke-width="2.5" />
    <path d="M 38 18 L 24 38 L 35 38 L 32 54 L 48 34 L 37 34 Z" fill="url(#boltGrad)" stroke="#ffffff" stroke-width="1" />

    <!-- Product Brand Text -->
    <text x="92" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
      NovaPilot<tspan fill="#10b981">.AI</tspan>
    </text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="275" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-1.5">
    Autonomous ChatOps &amp; Database Gatekeeper
  </text>

  <!-- Subtitle Tagline -->
  <text x="80" y="325" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    Zero Direct SQL • Hermes 3 8B Cognitive LLM • Model Context Protocol (MCP) • Human-in-the-Loop Sign-off
  </text>

  <!-- Feature Pillar Cards (Bottom Row) -->
  <g transform="translate(80, 380)">
    <!-- Pillar 1 -->
    <rect x="0" y="0" width="245" height="150" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-opacity="0.6" stroke-width="1.5" />
    <circle cx="32" cy="34" r="14" fill="#10b981" fill-opacity="0.15" />
    <text x="32" y="40" fill="#10b981" font-size="16" text-anchor="middle">🛡️</text>
    <text x="24" y="80" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Zero Raw SQL Guard</text>
    <text x="24" y="105" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Parameterized templates enforce complete schema protection</text>

    <!-- Pillar 2 -->
    <rect x="260" y="0" width="245" height="150" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-opacity="0.6" stroke-width="1.5" />
    <circle cx="292" cy="34" r="14" fill="#a855f7" fill-opacity="0.15" />
    <text x="292" y="40" fill="#c084fc" font-size="16" text-anchor="middle">🧠</text>
    <text x="284" y="80" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Hermes 3 AI Engine</text>
    <text x="284" y="105" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">8B cognitive reasoning &amp; structured parameter extraction</text>

    <!-- Pillar 3 -->
    <rect x="520" y="0" width="245" height="150" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-opacity="0.6" stroke-width="1.5" />
    <circle cx="552" cy="34" r="14" fill="#06b6d4" fill-opacity="0.15" />
    <text x="552" y="40" fill="#38bdf8" font-size="16" text-anchor="middle">🤖</text>
    <text x="544" y="80" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">OpenClaw Browser</text>
    <text x="544" y="105" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Headless Playwright agent for automated web verification</text>

    <!-- Pillar 4 -->
    <rect x="780" y="0" width="260" height="150" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-opacity="0.6" stroke-width="1.5" />
    <circle cx="812" cy="34" r="14" fill="#f59e0b" fill-opacity="0.15" />
    <text x="812" y="40" fill="#fbbf24" font-size="16" text-anchor="middle">⚡</text>
    <text x="804" y="80" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Dual-DB Isolation</text>
    <text x="804" y="105" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Physical separation of ticket audit store &amp; ERP ledgers</text>
  </g>

  <!-- Author Tag Bottom Right -->
  <text x="1120" y="585" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="end">
    Engineered by @RifkyA911 • github.com/RifkyA911/novapilot-ai
  </text>
</svg>
