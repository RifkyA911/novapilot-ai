<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Rounded Square App Icon -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2.5" />

  <!-- Shield Base Outline -->
  <path d="M 64 22 
           C 86 22 102 28 102 42 
           C 102 76 80 98 64 106 
           C 48 98 26 76 26 42 
           C 26 28 42 22 64 22 Z" 
        fill="url(#shieldGrad)" 
        fill-opacity="0.18" 
        stroke="url(#shieldGrad)" 
        stroke-width="3" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Central Dynamic Lightning Bolt -->
  <path d="M 68 32 
           L 44 64 
           L 62 64 
           L 58 96 
           L 84 60 
           L 66 60 Z" 
        fill="url(#boltGrad)" 
        stroke="#ffffff" 
        stroke-width="1.5" 
        stroke-linejoin="round" />

  <!-- Inner Sparkle Core -->
  <circle cx="64" cy="22" r="3" fill="#34d399" />
  <circle cx="64" cy="106" r="2.5" fill="#10b981" />
</svg>
